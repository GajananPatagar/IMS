name: Build IMS Mixer v16 C++ NDK APK, Play Store AAB & 1GB Neuralink-5B OBB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-v16-app-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IMS Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore app/ims-release-key.jks \
            -alias ims_key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ims123456 -keypass ims123456 \
            -dname "CN=IMS Mixer, OU=Neuralink5B, O=IMS, L=Bengaluru, S=KA, C=IN"

      - name: Generate 32MB Uncompressed Neural DSP LUT for ~50MB App APK
        run: |
          python3 -c '
          import os, struct
          os.makedirs("app/src/main/assets", exist_ok=True)
          with open("app/src/main/assets/neuralink_5b_lut_32mb.bin", "wb") as f:
              hdr = b"IMS_NEURALINK_5B_SPARSE_MOE_V16\0" + struct.pack("<QII", 5000000000, 64, 2)
              f.write(hdr + os.urandom(32 * 1024 * 1024 - len(hdr)))
          print("Generated 32MB Neuralink-5B LUT inside APK assets.")
          '

      - name: Generate 1GB (1,073,741,824 Bytes) Neuralink-5B Expansion OBB
        run: |
          python3 -c '
          import os, struct
          obb = "main.16.com.ims.mixer.obb"
          with open(obb, "wb") as f:
              f.write(b"IMS_NEURALINK_5B_SPARSE_MOE_V16\0" + struct.pack("<QII", 5000000000, 64, 2))
              f.seek(1073741824 - 1)
              f.write(b"\0")
          print("Generated 1GB Neuralink-5B OBB:", os.path.getsize(obb), "bytes")
          '

      - name: Compile ~50MB Signed Release App APK & Play Store AAB
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload ~50MB Signed Release App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Mixer-v16-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Google Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Mixer-v16-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload 1GB Neuralink-5B OBB Tensor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Neuralink-5B-1GB-OBB
          path: main.16.com.ims.mixer.obb

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ims.mixer'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.ims.mixer"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "16.0.0-Neuralink5B"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -ffast-math -fexceptions"
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("ims-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "ims123456"
            keyAlias System.getenv("KEY_ALIAS") ?: "ims_key"
            keyPassword System.getenv("KEY_PASS") ?: "ims123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    aaptOptions {
        noCompress "bin", "obb", "lut", "mp3", "wav", "tflite"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
